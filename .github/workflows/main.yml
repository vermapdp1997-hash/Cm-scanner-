name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'

      - name: Configure Android
        run: |
          # 1. Android प्रोजेक्ट बनाना
          flutter create --project-name cam_scanner --org com.mycompany.scanner .
          
          # 2. सुपर-फास्ट और एक्टिव Gradle 8.5 (bin) सेट करना
          sed -i 's|distributionUrl=.*|distributionUrl=https\\://services.gradle.org/distributions/gradle-8.5-bin.zip|' android/gradle/wrapper/gradle-wrapper.properties || true

          # 3. MinSdk 21 सेट करना
          sed -i 's/.*minSdk.*/        minSdk = 21/' android/app/build.gradle || true
          sed -i 's/.*minSdk =.*/        minSdk = 21/' android/app/build.gradle.kts || true
          
          # 4. AdMob ID
          sed -i '/<\/application>/i <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-3940256099942544~3347511713"/>' android/app/src/main/AndroidManifest.xml || true
          
          # 5. R8 Minify एरर बंद करना
          sed -i '/signingConfig/a \            minifyEnabled false\n            shrinkResources false' android/app/build.gradle || true
          sed -i '/signingConfig/a \            isMinifyEnabled = false\n            isShrinkResources = false' android/app/build.gradle.kts || true

      - name: Build APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BharatScanner-AI-App
          path: build/app/outputs/flutter-apk/app-release.apk
