name: Build APK and AAB

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.10'
          channel: 'stable'
          cache: true

      - name: Configure Android and Inject Native MediaStore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          # 1. Android प्रोजेक्ट बनाना (Unique Package ID for Play Store)
          flutter create --platforms=android --project-name bharat_document_scanner_ai --org com.yogeshverma .

          # 2. MainActivity.kt को MediaStore + Fast JPEG Resize/Rotate/Compress से अपडेट करना
          MAIN_KT=$(find android/app/src/main/kotlin -name "MainActivity.kt" | head -n 1)
          PKG_LINE=$(grep -m 1 "^package " "$MAIN_KT")
          echo "Updating $MAIN_KT ($PKG_LINE)"
          {
            echo "$PKG_LINE"
            cat << 'EOF'

          import android.content.ContentValues
          import android.graphics.Bitmap
          import android.graphics.BitmapFactory
          import android.graphics.Matrix
          import android.media.ExifInterface
          import android.media.MediaScannerConnection
          import android.net.Uri
          import android.os.Build
          import android.os.Environment
          import android.os.Handler
          import android.os.Looper
          import android.provider.MediaStore
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel
          import java.io.ByteArrayOutputStream
          import java.io.File
          import java.io.FileOutputStream
          import java.util.concurrent.Executors
          import kotlin.math.max
          import kotlin.math.roundToInt

          class MainActivity : FlutterActivity() {
              private val channelName = "bharat_scanner/media_store"
              private val ioExecutor = Executors.newFixedThreadPool(3)
              private val mainHandler = Handler(Looper.getMainLooper())

              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)
                  MethodChannel(flutterEngine.dartExecutor.binaryMessenger, channelName)
                      .setMethodCallHandler { call, result ->
                          when (call.method) {
                              "saveImage" -> {
                                  val bytes = call.argument<ByteArray>("bytes")
                                  val fileName = call.argument<String>("fileName") ?: "scan_${System.currentTimeMillis()}.jpg"
                                  val album = call.argument<String>("album") ?: "BharatScanner"
                                  if (bytes == null || bytes.isEmpty()) {
                                      result.error("INVALID_ARGS", "Image bytes missing", null)
                                      return@setMethodCallHandler
                                  }
                                  ioExecutor.execute {
                                      val saved = saveImageToMediaStore(bytes, fileName, album)
                                      mainHandler.post { result.success(saved) }
                                  }
                              }

                              "savePdf" -> {
                                  val bytes = call.argument<ByteArray>("bytes")
                                  val fileName = call.argument<String>("fileName") ?: "doc_${System.currentTimeMillis()}.pdf"
                                  val folder = call.argument<String>("folder") ?: "BharatScanner"
                                  if (bytes == null || bytes.isEmpty()) {
                                      result.error("INVALID_ARGS", "PDF bytes missing", null)
                                      return@setMethodCallHandler
                                  }
                                  ioExecutor.execute {
                                      val saved = savePdfToMediaStore(bytes, fileName, folder)
                                      mainHandler.post { result.success(saved) }
                                  }
                              }

                              "bakeAndResizeJpg" -> {
                                  val srcPath = call.argument<String>("srcPath")
                                  val dstPath = call.argument<String>("dstPath")
                                  val maxDim = call.argument<Int>("maxDim") ?: 2400
                                  val quality = call.argument<Int>("quality") ?: 90
                                  if (srcPath.isNullOrBlank() || dstPath.isNullOrBlank()) {
                                      result.success(false)
                                      return@setMethodCallHandler
                                  }
                                  ioExecutor.execute {
                                      val ok = bakeAndResizeJpgNative(srcPath, dstPath, maxDim, quality, extraRotate90 = false)
                                      mainHandler.post { result.success(ok) }
                                  }
                              }

                              "rotateJpg90" -> {
                                  val srcPath = call.argument<String>("srcPath")
                                  val dstPath = call.argument<String>("dstPath")
                                  val quality = call.argument<Int>("quality") ?: 92
                                  if (srcPath.isNullOrBlank() || dstPath.isNullOrBlank()) {
                                      result.success(false)
                                      return@setMethodCallHandler
                                  }
                                  ioExecutor.execute {
                                      val ok = bakeAndResizeJpgNative(srcPath, dstPath, maxDim = 2600, quality = quality, extraRotate90 = true)
                                      mainHandler.post { result.success(ok) }
                                  }
                              }

                              "compressJpgToTarget" -> {
                                  val srcPath = call.argument<String>("srcPath")
                                  val dstPath = call.argument<String>("dstPath")
                                  val targetBytes = call.argument<Int>("targetBytes") ?: (100 * 1024)
                                  if (srcPath.isNullOrBlank() || dstPath.isNullOrBlank()) {
                                      result.success(false)
                                      return@setMethodCallHandler
                                  }
                                  ioExecutor.execute {
                                      val ok = compressJpgToTargetNative(srcPath, dstPath, targetBytes)
                                      mainHandler.post { result.success(ok) }
                                  }
                              }

                              else -> result.notImplemented()
                          }
                      }
              }

              override fun onDestroy() {
                  ioExecutor.shutdownNow()
                  super.onDestroy()
              }

              private fun saveImageToMediaStore(bytes: ByteArray, fileName: String, album: String): String? {
                  return try {
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                          val values = ContentValues().apply {
                              put(MediaStore.Images.Media.DISPLAY_NAME, fileName)
                              put(MediaStore.Images.Media.MIME_TYPE, "image/jpeg")
                              put(MediaStore.Images.Media.RELATIVE_PATH, "${Environment.DIRECTORY_PICTURES}/$album")
                              put(MediaStore.Images.Media.IS_PENDING, 1)
                          }
                          val resolver = applicationContext.contentResolver
                          val uri: Uri = resolver.insert(MediaStore.Images.Media.EXTERNAL_CONTENT_URI, values) ?: return null
                          try {
                              resolver.openOutputStream(uri)?.use { it.write(bytes) }
                                  ?: throw IllegalStateException("Unable to open image stream")
                              values.clear()
                              values.put(MediaStore.Images.Media.IS_PENDING, 0)
                              resolver.update(uri, values, null, null)
                              uri.toString()
                          } catch (e: Exception) {
                              resolver.delete(uri, null, null)
                              null
                          }
                      } else {
                          @Suppress("DEPRECATION")
                          val picDir = Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_PICTURES)
                          val targetDir = File(picDir, album).apply { if (!exists()) mkdirs() }
                          val outFile = File(targetDir, fileName)
                          FileOutputStream(outFile).use { it.write(bytes) }
                          MediaScannerConnection.scanFile(applicationContext, arrayOf(outFile.absolutePath), arrayOf("image/jpeg"), null)
                          outFile.absolutePath
                      }
                  } catch (_: Exception) {
                      null
                  }
              }

              private fun savePdfToMediaStore(bytes: ByteArray, fileName: String, folder: String): String? {
                  return try {
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                          val values = ContentValues().apply {
                              put(MediaStore.Downloads.DISPLAY_NAME, fileName)
                              put(MediaStore.Downloads.MIME_TYPE, "application/pdf")
                              put(MediaStore.Downloads.RELATIVE_PATH, "${Environment.DIRECTORY_DOWNLOADS}/$folder")
                              put(MediaStore.Downloads.IS_PENDING, 1)
                          }
                          val resolver = applicationContext.contentResolver
                          val uri: Uri = resolver.insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, values) ?: return null
                          try {
                              resolver.openOutputStream(uri)?.use { it.write(bytes) }
                                  ?: throw IllegalStateException("Unable to open PDF stream")
                              values.clear()
                              values.put(MediaStore.Downloads.IS_PENDING, 0)
                              resolver.update(uri, values, null, null)
                              uri.toString()
                          } catch (e: Exception) {
                              resolver.delete(uri, null, null)
                              null
                          }
                      } else {
                          @Suppress("DEPRECATION")
                          val dlDir = Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_DOWNLOADS)
                          val targetDir = File(dlDir, folder).apply { if (!exists()) mkdirs() }
                          val outFile = File(targetDir, fileName)
                          FileOutputStream(outFile).use { it.write(bytes) }
                          MediaScannerConnection.scanFile(applicationContext, arrayOf(outFile.absolutePath), arrayOf("application/pdf"), null)
                          outFile.absolutePath
                      }
                  } catch (_: Exception) {
                      null
                  }
              }

              private fun readExifOrient(path: String): Int {
                  return try {
                      ExifInterface(path).getAttributeInt(
                          ExifInterface.TAG_ORIENTATION,
                          ExifInterface.ORIENTATION_NORMAL
                      )
                  } catch (_: Exception) {
                      ExifInterface.ORIENTATION_NORMAL
                  }
              }

              private fun applyExifToMatrix(matrix: Matrix, exifOrient: Int) {
                  when (exifOrient) {
                      ExifInterface.ORIENTATION_FLIP_HORIZONTAL -> matrix.setScale(-1f, 1f)
                      ExifInterface.ORIENTATION_ROTATE_180 -> matrix.postRotate(180f)
                      ExifInterface.ORIENTATION_FLIP_VERTICAL -> matrix.setScale(1f, -1f)
                      ExifInterface.ORIENTATION_TRANSPOSE -> {
                          matrix.setRotate(90f)
                          matrix.postScale(-1f, 1f)
                      }
                      ExifInterface.ORIENTATION_ROTATE_90 -> matrix.postRotate(90f)
                      ExifInterface.ORIENTATION_TRANSVERSE -> {
                          matrix.setRotate(-90f)
                          matrix.postScale(-1f, 1f)
                      }
                      ExifInterface.ORIENTATION_ROTATE_270 -> matrix.postRotate(270f)
                  }
              }

              private fun writeBytesSafely(bytes: ByteArray, dstPath: String): Boolean {
                  val dstFile = File(dstPath)
                  dstFile.parentFile?.mkdirs()
                  val tmpFile = File(dstFile.parentFile, "${dstFile.name}.tmp_${System.nanoTime()}")
                  return try {
                      FileOutputStream(tmpFile).use {
                          it.write(bytes)
                          it.flush()
                      }
                      if (dstFile.exists()) dstFile.delete()
                      if (!tmpFile.renameTo(dstFile)) {
                          tmpFile.copyTo(dstFile, overwrite = true)
                          tmpFile.delete()
                      }
                      true
                  } catch (_: Exception) {
                      try { if (tmpFile.exists()) tmpFile.delete() } catch (_: Exception) {}
                      false
                  }
              }

              private fun writeBitmapSafely(bmp: Bitmap, dstPath: String, quality: Int): Boolean {
                  val dstFile = File(dstPath)
                  dstFile.parentFile?.mkdirs()
                  val tmpFile = File(dstFile.parentFile, "${dstFile.name}.tmp_${System.nanoTime()}")
                  return try {
                      FileOutputStream(tmpFile).use {
                          bmp.compress(Bitmap.CompressFormat.JPEG, quality.coerceIn(5, 100), it)
                          it.flush()
                      }
                      if (dstFile.exists()) dstFile.delete()
                      if (!tmpFile.renameTo(dstFile)) {
                          tmpFile.copyTo(dstFile, overwrite = true)
                          tmpFile.delete()
                      }
                      true
                  } catch (_: Exception) {
                      try { if (tmpFile.exists()) tmpFile.delete() } catch (_: Exception) {}
                      false
                  }
              }

              private fun bakeAndResizeJpgNative(
                  srcPath: String,
                  dstPath: String,
                  maxDim: Int,
                  quality: Int,
                  extraRotate90: Boolean
              ): Boolean {
                  var decoded: Bitmap? = null
                  var transformed: Bitmap? = null
                  return try {
                      val srcFile = File(srcPath)
                      if (!srcFile.exists()) return false
                      val exifOrient = readExifOrient(srcPath)

                      val boundsOpts = BitmapFactory.Options().apply { inJustDecodeBounds = true }
                      BitmapFactory.decodeFile(srcPath, boundsOpts)
                      val rawW = boundsOpts.outWidth
                      val rawH = boundsOpts.outHeight
                      if (rawW <= 0 || rawH <= 0) return false

                      if (!extraRotate90 &&
                          exifOrient == ExifInterface.ORIENTATION_NORMAL &&
                          rawW <= maxDim && rawH <= maxDim &&
                          srcPath.lowercase().endsWith(".jpg")
                      ) {
                          if (srcFile.absolutePath != File(dstPath).absolutePath) {
                              File(dstPath).parentFile?.mkdirs()
                              srcFile.copyTo(File(dstPath), overwrite = true)
                          }
                          return true
                      }

                      var sampleSize = 1
                      val longestRaw = max(rawW, rawH)
                      while ((longestRaw / (sampleSize * 2)) >= maxDim) {
                          sampleSize *= 2
                      }

                      val decodeOpts = BitmapFactory.Options().apply {
                          inSampleSize = sampleSize
                          inPreferredConfig = Bitmap.Config.ARGB_8888
                      }
                      decoded = BitmapFactory.decodeFile(srcPath, decodeOpts) ?: return false

                      val matrix = Matrix()
                      applyExifToMatrix(matrix, exifOrient)
                      if (extraRotate90) {
                          matrix.postRotate(90f)
                      }

                      transformed = if (matrix.isIdentity) {
                          decoded
                      } else {
                          Bitmap.createBitmap(decoded, 0, 0, decoded.width, decoded.height, matrix, true)
                      }
                      if (transformed !== decoded) decoded.recycle()

                      val longest = max(transformed.width, transformed.height)
                      if (longest > maxDim && maxDim > 0) {
                          val scale = maxDim.toFloat() / longest.toFloat()
                          val dstW = max(1, (transformed.width * scale).roundToInt())
                          val dstH = max(1, (transformed.height * scale).roundToInt())
                          val scaled = Bitmap.createScaledBitmap(transformed, dstW, dstH, true)
                          if (scaled !== transformed) transformed.recycle()
                          transformed = scaled
                      }

                      writeBitmapSafely(transformed, dstPath, quality)
                  } catch (_: Exception) {
                      false
                  } finally {
                      try { if (transformed != null && !transformed.isRecycled) transformed.recycle() } catch (_: Exception) {}
                      try { if (decoded != null && !decoded.isRecycled) decoded.recycle() } catch (_: Exception) {}
                  }
              }

              private fun compressJpgToTargetNative(srcPath: String, dstPath: String, targetBytes: Int): Boolean {
                  var working: Bitmap? = null
                  return try {
                      val maxDim = when {
                          targetBytes < 12 * 1024 -> 360
                          targetBytes < 24 * 1024 -> 500
                          targetBytes < 50 * 1024 -> 720
                          targetBytes < 110 * 1024 -> 1020
                          targetBytes < 250 * 1024 -> 1380
                          else -> 1650
                      }
                      val exifOrient = readExifOrient(srcPath)
                      val bounds = BitmapFactory.Options().apply { inJustDecodeBounds = true }
                      BitmapFactory.decodeFile(srcPath, bounds)
                      if (bounds.outWidth <= 0 || bounds.outHeight <= 0) return false

                      var sample = 1
                      val longestRaw = max(bounds.outWidth, bounds.outHeight)
                      while ((longestRaw / (sample * 2)) >= maxDim) {
                          sample *= 2
                      }
                      val raw = BitmapFactory.decodeFile(srcPath, BitmapFactory.Options().apply {
                          inSampleSize = sample
                          inPreferredConfig = Bitmap.Config.ARGB_8888
                      }) ?: return false

                      val matrix = Matrix()
                      applyExifToMatrix(matrix, exifOrient)
                      working = if (matrix.isIdentity) raw else Bitmap.createBitmap(raw, 0, 0, raw.width, raw.height, matrix, true)
                      if (working !== raw) raw.recycle()

                      val curLong = max(working!!.width, working!!.height)
                      if (curLong > maxDim) {
                          val s = maxDim.toFloat() / curLong.toFloat()
                          val scaled = Bitmap.createScaledBitmap(working!!, max(1, (working!!.width * s).roundToInt()), max(1, (working!!.height * s).roundToInt()), true)
                          if (scaled !== working) working!!.recycle()
                          working = scaled
                      }

                      fun binarySearchJpg(bmp: Bitmap): ByteArray {
                          var lo = 8
                          var hi = 92
                          val baos = ByteArrayOutputStream()
                          bmp.compress(Bitmap.CompressFormat.JPEG, 42, baos)
                          var best = baos.toByteArray()
                          for (i in 0 until 6) {
                              val mid = (lo + hi) / 2
                              baos.reset()
                              bmp.compress(Bitmap.CompressFormat.JPEG, mid, baos)
                              val cand = baos.toByteArray()
                              if (cand.size <= targetBytes) {
                                  best = cand
                                  lo = mid + 1
                              } else {
                                  if (best.size > targetBytes) best = cand
                                  hi = mid - 1
                              }
                          }
                          return best
                      }

                      var bestBytes = binarySearchJpg(working!!)
                      var tries = 0
                      while (bestBytes.size > targetBytes && working!!.width > 120 && working!!.height > 120 && tries < 6) {
                          val scaled = Bitmap.createScaledBitmap(working!!, max(120, (working!!.width * 0.72f).roundToInt()), max(120, (working!!.height * 0.72f).roundToInt()), true)
                          if (scaled !== working) working!!.recycle()
                          working = scaled
                          bestBytes = binarySearchJpg(working!!)
                          tries++
                      }
                      writeBytesSafely(bestBytes, dstPath)
                  } catch (_: Exception) {
                      false
                  } finally {
                      try { if (working != null && !working.isRecycled) working.recycle() } catch (_: Exception) {}
                  }
              }
          }
          EOF
          } > "$MAIN_KT"

          # 3. AndroidManifest.xml (असली AdMob App ID + AD_ID + Play Store Scoped Storage + Optional Portrait Hardware)
          cat << 'EOF' > android/app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:tools="http://schemas.android.com/tools">
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="com.google.android.gms.permission.AD_ID" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28" />

              <uses-feature android:name="android.hardware.camera" android:required="false" />
              <uses-feature android:name="android.hardware.camera.autofocus" android:required="false" />
              <uses-feature android:name="android.hardware.screen.portrait" android:required="false" tools:replace="android:required" />

              <application
                  android:label="Bharat Document Scanner PDF AI"
                  android:name="${applicationName}"
                  android:icon="@mipmap/ic_launcher"
                  android:requestLegacyExternalStorage="false">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:taskAffinity=""
                      android:theme="@style/LaunchTheme"
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"
                      android:hardwareAccelerated="true"
                      android:windowSoftInputMode="adjustResize">
                      <meta-data
                          android:name="io.flutter.embedding.android.NormalTheme"
                          android:resource="@style/NormalTheme" />
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <meta-data
                      android:name="com.google.android.gms.ads.APPLICATION_ID"
                      android:value="ca-app-pub-7940311763952252~7807809920" />
                  <meta-data
                      android:name="flutterEmbedding"
                      android:value="2" />
              </application>

              <queries>
                  <intent>
                      <action android:name="android.intent.action.PROCESS_TEXT" />
                      <data android:mimeType="text/plain" />
                  </intent>
              </queries>
          </manifest>
          EOF

          # 4. Optional Release Keystore (अगर GitHub Secrets जुड़े हों तो Play Store Signed AAB बनेगा)
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
            cat << EOF > android/key.properties
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF
          fi

          # 5. Play Store API 36 (compileSdk 36, targetSdk 36, minSdk 23) + Safe Signing Config
          python3 - << 'PYEOF'
          import re
          from pathlib import Path

          kts = Path("android/app/build.gradle.kts")
          if kts.exists():
              txt = kts.read_text()
              txt = re.sub(r'compileSdk\s*=\s*.*', 'compileSdk = 36', txt)
              txt = re.sub(r'minSdk\s*=\s*.*', 'minSdk = 23', txt)
              txt = re.sub(r'targetSdk\s*=\s*.*', 'targetSdk = 36', txt)
              if 'java.util.Properties' not in txt:
                  txt = 'import java.util.Properties\nimport java.io.FileInputStream\n\n' + txt
              signing_block = '''    val keystoreProperties = Properties()
              val keystorePropertiesFile = rootProject.file("key.properties")
              if (keystorePropertiesFile.exists()) {
                  keystoreProperties.load(FileInputStream(keystorePropertiesFile))
              }

              signingConfigs {
                  create("release") {
                      if (keystorePropertiesFile.exists()) {
                          keyAlias = keystoreProperties.getProperty("keyAlias")
                          keyPassword = keystoreProperties.getProperty("keyPassword")
                          storeFile = file(keystoreProperties.getProperty("storeFile"))
                          storePassword = keystoreProperties.getProperty("storePassword")
                      }
                  }
              }

          '''
              if 'signingConfigs {' not in txt:
                  txt = txt.replace('    buildTypes {', signing_block + '    buildTypes {', 1)
              txt = re.sub(
                  r'signingConfig\s*=\s*signingConfigs\.getByName\("debug"\)',
                  'signingConfig = if (rootProject.file("key.properties").exists()) signingConfigs.getByName("release") else signingConfigs.getByName("debug")\n            isMinifyEnabled = false\n            isShrinkResources = false',
                  txt
              )
              kts.write_text(txt)
          PYEOF

      - name: Get Flutter Dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Build Play Store AAB
        run: flutter build appbundle --release --no-tree-shake-icons

      - name: Verify Portrait Feature in Built APK and Merged Manifest
        run: |
          echo "=== Merged Manifest Check ==="
          find build/app/intermediates -name "AndroidManifest.xml" -exec grep -H "screen.portrait" {} + || true
          echo "=== AAPT2 Badging Check ==="
          AAPT2=$(find "$ANDROID_HOME/build-tools" -name "aapt2" 2>/dev/null | sort -V | tail -n 1)
          if [ -n "$AAPT2" ]; then
            "$AAPT2" dump badging build/app/outputs/flutter-apk/app-release.apk | grep -i -E "uses-feature|screen.portrait" || true
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BharatScanner-AI-APK
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Upload Play Store AAB
        uses: actions/upload-artifact@v4
        with:
          name: BharatScanner-AI-PlayStore-AAB
          path: build/app/outputs/bundle/release/app-release.aab
