name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'

      - name: Configure Android
        run: |
          flutter create --project-name cam_scanner --org com.mycompany.scanner .
          sed -i 's/.*minSdk.*/        minSdk = 21/' android/app/build.gradle || true
          sed -i 's/.*minSdk =.*/        minSdk = 21/' android/app/build.gradle.kts || true
          sed -i '/<\/application>/i <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-3940256099942544~3347511713"/>' android/app/src/main/AndroidManifest.xml
          
          # R8 और Google AI की चेतावनियों को नजरअंदाज करने के नियम
          echo "-dontwarn com.google.mlkit.**" > android/app/proguard-rules.pro
          echo "-keep class com.google.mlkit.** { *; }" >> android/app/proguard-rules.pro
          sed -i '/signingConfig/a \            minifyEnabled false' android/app/build.gradle || true
          sed -i '/signingConfig/a \            isMinifyEnabled = false' android/app/build.gradle.kts || true

      - name: Build APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BharatScanner-AI-App
          path: build/app/outputs/flutter-apk/app-release.apk
